name: C++ GoogleTest Auto-grading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure and Build (Come in locale)
      run: |
        mkdir build
        cd build
        cmake ..
        make

    - name: Run Tests (Level 1)
      working-directory: build
      run: ctest

   