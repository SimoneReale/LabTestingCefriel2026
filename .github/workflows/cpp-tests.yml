name: C++ GoogleTest Auto-grading

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Configure CMake
      # Aggiungiamo esplicitamente il flag per generare i file in modalità Release
      run: cmake -B build -S . -DCMAKE_BUILD_TYPE=Release

    - name: Build
      run: cmake --build build --config Release

    - name: Run Tests (Level 1)
      working-directory: build
      # Diciamo a CTest di cercare specificamente i test compilati in Release
      run: ctest -C Release -R level1 --output-on-failure

    - name: Run Tests (Level 2)
      working-directory: build
      run: ctest -C Release -R level2 --output-on-failure

    - name: Run Tests (Level 3)
      working-directory: build
      run: ctest -C Release -R level3 --output-on-failure